services:
  postgres:
    image: postgres:16-alpine
    container_name: s12-ferreteria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - s12_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  s12_pg_data:
